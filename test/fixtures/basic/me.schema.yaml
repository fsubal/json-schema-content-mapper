summary: ログイン中のユーザーを取得する
parameters:
  - name: include
    in: query
    schema:
      type: string
      enum: [profile, settings]
  - name: X-Request-Id
    in: header
    required: true
    schema:
      type: string
responses:
  "200":
    description: ログイン中のユーザー
    content:
      application/json:
        schema:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: integer
                role:
                  type: string
                pixiv_id:
                  type: integer
                  nullable: true
                email_address:
                  type: [string, "null"]
              required: [id, role]
              additionalProperties: false
          required: [user]
          additionalProperties: false
  "401":
    description: 未ログイン
    content:
      application/problem+json:
        schema:
          type: object
          properties:
            error:
              type: string
          required: [error]
          additionalProperties: false
  "204":
    description: No Content
